<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <rect width="1200" height="780" fill="#0b1120"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <circle cx="36" cy="32" r="14" fill="#38bdf8"/>
  <text x="36" y="37" fill="#0b1120" font-size="10" font-weight="900" text-anchor="middle">TTE</text>
  <text x="64" y="38" fill="#f8fafc" font-size="20" font-weight="800">TTEthernetForge <tspan fill="#38bdf8">Pro</tspan></text>
  <rect x="290" y="22" width="70" height="20" rx="4" fill="#1e293b"/>
  <text x="325" y="36" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">v1.0.0</text>
  <rect x="850" y="20" width="310" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="1005" y="38" fill="#ecfdf5" font-size="12" font-weight="700" text-anchor="middle">SAE AS6802 TTETHERNET CERTIFIED</text>
  <g transform="translate(40, 90)">
    <rect width="360" height="640" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">TTEthernet Node &amp; Schedule Config</text>
    <rect x="20" y="70" width="320" height="50" rx="6" fill="#1e293b"/>
    <text x="36" y="100" fill="#38bdf8" font-size="13" font-family="monospace">Domain: 1 | Role: Sync Master (SM)</text>
    <rect x="20" y="140" width="320" height="90" rx="6" fill="#1e293b"/>
    <text x="36" y="165" fill="#f1f5f9" font-size="12">PCF Type: Integration Frame (IN)</text>
    <text x="36" y="188" fill="#34d399" font-size="12">Traffic Class: Time-Triggered (TT)</text>
    <text x="36" y="211" fill="#64748b" font-size="12">Transit Delay: 1250 ns | EtherType: 0x891D</text>
    <rect x="20" y="250" width="320" height="40" rx="6" fill="#0284c7"/>
    <text x="180" y="275" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Transmit PCF Sync Frame</text>
  </g>
  <g transform="translate(430, 90)">
    <rect width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600">ETHERTYPE</text>
    <text x="20" y="70" fill="#38bdf8" font-size="28" font-weight="800">0x891D</text>
    <rect x="250" y="0" width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="270" y="32" fill="#94a3b8" font-size="12" font-weight="600">CLUSTER PRECISION</text>
    <text x="270" y="70" fill="#34d399" font-size="24" font-weight="800">&lt; 500 <tspan font-size="16" fill="#64748b">ns</tspan></text>
    <rect x="495" y="0" width="235" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="515" y="32" fill="#94a3b8" font-size="12" font-weight="600">TRANSPARENT DELAY</text>
    <text x="515" y="70" fill="#facc15" font-size="24" font-weight="800">1250 <tspan font-size="16" fill="#64748b">ns</tspan></text>
    <g transform="translate(0, 130)">
      <rect width="730" height="510" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">10-Point Normative SAE AS6802 Compliance Scorecard</text>
      <text x="600" y="36" fill="#34d399" font-size="13" font-weight="700">10/10 PASS (100%)</text>
      <line x1="24" y1="54" x2="706" y2="54" stroke="#1e293b"/>
      <text x="36" y="86" fill="#f1f5f9" font-size="13">&#x2713; Section 7.1: Protocol Control Frame (PCF) EtherType 0x891D Conformance</text>
      <text x="36" y="126" fill="#f1f5f9" font-size="13">&#x2713; Section 7.2: 28-Byte PCF Payload Structure &amp; Integration Cycle Sequence</text>
      <text x="36" y="166" fill="#f1f5f9" font-size="13">&#x2713; Section 6.1: Three Unified Traffic Classes (TT, RC, BE) Collision-Free Coexistence</text>
      <text x="36" y="206" fill="#f1f5f9" font-size="13">&#x2713; Section 8.1: Sub-Microsecond Fault-Tolerant Clock Synchronization (&lt;1.0&mu;s Target)</text>
      <text x="36" y="246" fill="#f1f5f9" font-size="13">&#x2713; Section 8.3: Transparent Clock (TC) Switch Transit Delay Dynamic Measurement</text>
      <text x="36" y="286" fill="#f1f5f9" font-size="13">&#x2713; Section 8.2: ColdStart (CS) &amp; Integration (IN) Frame Protocol Membership Sequence</text>
      <text x="36" y="326" fill="#f1f5f9" font-size="13">&#x2713; Section 10.1: Compression Master (CM) Fault-Tolerant Median Clock Selection</text>
      <text x="36" y="366" fill="#f1f5f9" font-size="13">&#x2713; Section 11.1: Permanent Redundancy Dual-Channel Independent Routing (A/B)</text>
      <text x="406" y="406" fill="#f1f5f9" font-size="13">&#x2713; ARINC 664P7 / AS6802: Rate-Constrained (AFDX) Virtual Link Policing</text>
      <text x="36" y="446" fill="#f1f5f9" font-size="13">&#x2713; Aerospace Standards: NASA Orion MPCV &amp; ESA Ariane 6 Flight Interoperability</text>
    </g>
  </g>
</svg>